name: brewlog
description: "BrewLog — 精品咖啡沖煮記錄 App。可複製配方的閉環工具。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 狀態管理 — §8.2
  flutter_riverpod: ^2.6.1

  # 路由 — §8.2
  go_router: ^14.6.2

  # 本機儲存 — §8.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # 偏好設定 — §8.2
  shared_preferences: ^2.3.3

  # i18n — §8.2
  intl: ^0.20.1

  # 圖表(萃取控制圖) — §8.2,§F4.2
  fl_chart: ^0.69.2

  # 螢幕常亮(計時器) — §8.2,§F2.1
  wakelock_plus: ^1.2.10
  # S0 暫不安裝:該套件未支援 Swift Package Manager,S3 改用 HapticFeedback 先頂著

  # 照片 — §8.2
  image_picker: ^1.1.2
  path_provider: ^2.1.5

  # 內購 — §8.2,§11
  in_app_purchase: ^3.2.0

  # UUID — §8.2
  uuid: ^4.5.1

  # 時間格式(計時器 mm:ss) — §F2.1
  duration: ^4.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # 給 widget_test 用 fake path_provider
  path_provider_platform_interface: ^2.1.2

  # 測試 mock — §8.2
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  fonts:
    - family: NotoSansTC
      fonts:
        - asset: assets/fonts/NotoSansTC-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansTC-Bold.ttf
          weight: 700
  generate: true
  assets:
    - assets/data/
